<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>Catatan Keuangan</title>
<style>
  body{font-family:system-ui,sans-serif;background:#f4f6f8;color:#222;margin:0 auto;padding:16px;max-width:600px}
  h1{font-size:22px;margin:4px 0 12px}
  h2{font-size:16px;margin:0 0 10px}
  .card{background:#fff;border-radius:10px;padding:14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  input,select,button{font-size:16px;padding:10px;border-radius:8px;border:1px solid #ccc;width:100%;box-sizing:border-box;margin-bottom:8px}
  button{background:#2563eb;color:#fff;border:none;cursor:pointer}
  button.sec{background:#475569}
  button.del{background:#dc2626;width:auto;padding:4px 10px;margin:0;font-size:13px}
  .row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eee;gap:8px}
  .row:last-child{border-bottom:none}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .total{font-size:18px;font-weight:bold}
  .naik{color:#dc2626}.turun{color:#16a34a}
  .muted{color:#64748b;font-size:13px}
</style>
</head>
<body>
<h1>💰 Catatan Keuangan</h1>

<div class="card">
  <h2>Tambah pengeluaran</h2>
  <input type="date" id="tgl">
  <input type="text" id="nama" placeholder="Beli apa? (contoh: Nasi goreng)">
  <div class="grid2">
    <select id="kategori">
      <option>Makan</option><option>Jajan</option><option>Transport</option>
      <option>Kos</option><option>Kuota/Pulsa</option><option>Belanja</option><option>Lainnya</option>
    </select>
    <input type="number" id="jumlah" placeholder="Jumlah (Rp)" inputmode="numeric">
  </div>
  <button id="btnTambah">Simpan</button>
</div>

<div class="card">
  <h2>Pengeluaran hari ini <span class="muted" id="labelHariIni"></span></h2>
  <div id="listHariIni"></div>
  <div class="row"><span>Total</span><span class="total" id="totalHariIni"></span></div>
</div>

<div class="card">
  <h2>Bandingkan dua hari</h2>
  <div class="grid2">
    <div><span class="muted">Hari A</span><input type="date" id="cmpA"></div>
    <div><span class="muted">Hari B</span><input type="date" id="cmpB"></div>
  </div>
  <div id="hasilCmp"></div>
</div>

<div class="card">
  <h2>Data &amp; backup</h2>
  <button id="btnExcel" class="sec">Export ke Excel (CSV)</button>
  <button id="btnBackup" class="sec">Export backup (JSON)</button>
  <input type="file" id="fileImport" accept=".json,application/json" style="display:none">
  <button id="btnImport" class="sec">Import backup (JSON)</button>
  <p class="muted">Simpan file backup secara rutin, misalnya ke Google Drive, sebelum ganti HP.</p>
</div>

<script>
const KEY = 'catatan-keuangan-v1';
let data = JSON.parse(localStorage.getItem(KEY) || '[]');
const $ = id => document.getElementById(id);

const rp = n => 'Rp ' + Number(n).toLocaleString('id-ID');
// Format tanggal lokal (hindari toISOString karena bisa bergeser zona waktu)
const tglStr = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const hariIni = () => tglStr(new Date());
const kemarin = () => { const d = new Date(); d.setDate(d.getDate()-1); return tglStr(d); };
const tglIndo = s => { const [y,m,d] = s.split('-'); return d + '/' + m + '/' + y; };

function simpan() { localStorage.setItem(KEY, JSON.stringify(data)); }
function itemPadaTgl(tgl) { return data.filter(x => x.tanggal === tgl); }
function totalPadaTgl(tgl) { return itemPadaTgl(tgl).reduce((s,x) => s + Number(x.jumlah), 0); }

function renderHariIni() {
  const t = hariIni();
  $('labelHariIni').textContent = '(' + tglIndo(t) + ')';
  const list = itemPadaTgl(t);
  $('listHariIni').innerHTML = list.length ? '' : '<p class="muted">Belum ada catatan hari ini.</p>';
  list.forEach(x => {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<div><b></b><br><span class="muted"></span></div>
      <div style="display:flex;align-items:center;gap:8px"><span></span><button class="del">Hapus</button></div>`;
    row.querySelector('b').textContent = x.nama;
    row.querySelector('.muted').textContent = x.kategori;
    row.querySelector('span:not(.muted)') ; 
    row.querySelectorAll('span')[1].textContent = rp(x.jumlah);
    row.querySelector('.del').onclick = () => {
      if (confirm('Hapus catatan ini?')) { data = data.filter(d => d.id !== x.id); simpan(); renderSemua(); }
    };
    $('listHariIni').appendChild(row);
  });
  $('totalHariIni').textContent = rp(totalPadaTgl(t));
}

function renderCompare() {
  const a = $('cmpA').value, b = $('cmpB').value;
  if (!a || !b) { $('hasilCmp').innerHTML = ''; return; }
  const ta = totalPadaTgl(a), tb = totalPadaTgl(b);
  const selisih = tb - ta;
  const persen = ta === 0 ? '-' : ((selisih / ta) * 100).toFixed(1) + '%';
  const kelas = selisih > 0 ? 'naik' : (selisih < 0 ? 'turun' : '');
  const tanda = selisih > 0 ? 'lebih banyak' : (selisih < 0 ? 'lebih sedikit' : 'sama');

  const kategoriSet = [...new Set([...itemPadaTgl(a), ...itemPadaTgl(b)].map(x => x.kategori))];
  const perKat = kategoriSet.map(k => {
    const ka = itemPadaTgl(a).filter(x => x.kategori === k).reduce((s,x)=>s+Number(x.jumlah),0);
    const kb = itemPadaTgl(b).filter(x => x.kategori === k).reduce((s,x)=>s+Number(x.jumlah),0);
    return `<div class="row"><span>${k}</span><span>${rp(ka)} &rarr; ${rp(kb)}</span></div>`;
  }).join('');

  $('hasilCmp').innerHTML = `
    <div class="row"><span>${tglIndo(a)}</span><b>${rp(ta)}</b></div>
    <div class="row"><span>${tglIndo(b)}</span><b>${rp(tb)}</b></div>
    <div class="row"><span>Selisih</span><b class="${kelas}">${rp(Math.abs(selisih))} ${tanda} (${persen})</b></div>
    ${perKat ? '<p class="muted" style="margin:10px 0 4px">Per kategori (Hari A &rarr; Hari B)</p>' + perKat : ''}`;
}

function renderSemua() {
  renderHariIni();
  renderCompare();
}

$('btnTambah').onclick = () => {
  const tgl = $('tgl').value || hariIni();
  const nama = $('nama').value.trim();
  const jumlah = Number($('jumlah').value);
  if (!nama || !jumlah || jumlah <= 0) { alert('Isi nama barang dan jumlah dengan benar.'); return; }
  data.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
              tanggal: tgl, nama, kategori: $('kategori').value, jumlah });
  simpan();
  $('nama').value = ''; $('jumlah').value = '';
  renderSemua();
};

$('cmpA').value = hariIni();
$('cmpB').value = kemarin();
$('tgl').value = hariIni();
$('cmpA').onchange = renderCompare;
$('cmpB').onchange = renderCompare;

function unduh(nama, isi, tipe) {
  const blob = new Blob([isi], { type: tipe });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nama;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

$('btnExcel').onclick = () => {
  const esc = v => '"' + String(v).replace(/"/g, '""') + '"';
  const baris = [['Tanggal','Nama Barang','Kategori','Jumlah'],
    ...[...data].sort((x,y) => x.tanggal.localeCompare(y.tanggal))
      .map(x => [tglIndo(x.tanggal), x.nama, x.kategori, x.jumlah])];
  // Pakai ';' dan BOM agar Excel versi Indonesia membacanya dengan benar
  const isi = '\uFEFF' + baris.map(r => r.map(esc).join(';')).join('\r\n');
  unduh('catatan-keuangan.csv', isi, 'text/csv;charset=utf-8');
};

$('btnBackup').onclick = () => {
  unduh('backup-keuangan-' + hariIni() + '.json', JSON.stringify(data, null, 2), 'application/json');
};

$('btnImport').onclick = () => $('fileImport').click();
$('fileImport').onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const masuk = JSON.parse(await file.text());
    if (!Array.isArray(masuk)) throw new Error('format');
    const idAda = new Set(data.map(x => x.id));
    let tambah = 0;
    masuk.forEach(x => {
      if (x && x.id && !idAda.has(x.id) && x.tanggal && x.nama && x.jumlah != null) {
        data.push(x); idAda.add(x.id); tambah++;
      }
    });
    simpan(); renderSemua();
    alert('Import selesai. ' + tambah + ' catatan baru ditambahkan (duplikat dilewati).');
  } catch (err) {
    alert('File backup tidak valid.');
  }
  e.target.value = '';
};

renderSemua();

// Daftarkan service worker agar aplikasi bisa dibuka offline
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
